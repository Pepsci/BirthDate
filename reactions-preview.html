<!doctype html><meta charset="utf-8">
<style>
 body{margin:0;font:14px system-ui;display:flex;gap:0}
 .side{flex:1;padding:28px}
 .light{background:#ffffff;color:#111}
 .dark{background:#0b1120;color:#e5e7eb}
 h2{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.5;margin:0 0 18px}
 .row{display:flex;gap:14px;align-items:flex-end;margin-bottom:26px}
 .cell{text-align:center}
 .cell small{display:block;margin-top:6px;font-size:10px;opacity:.55}
 .bubble{display:inline-block;background:#3b82f6;color:#fff;padding:9px 13px;border-radius:14px;font-size:13px}
 .dark .bubble{background:#1e3a8a}
 .pills{margin-top:-8px;margin-left:10px;display:flex;gap:4px}
 .pill{display:inline-flex;align-items:center;gap:3px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:2px 7px 2px 5px;font-size:11px}
 .dark .pill{background:#1e293b;border-color:#334155;color:#e5e7eb}
</style>
<div class="side light"><h2>Clair</h2><div id="a"></div></div>
<div class="side dark"><h2>Sombre</h2><div id="b"></div></div>
<script>
const FACE="#F5B301",INK="#7A5600";
const S=n=>`<svg width="${n.s}" height="${n.s}" viewBox="0 0 24 24">${n.body}</svg>`;
const D={
 like:`<path d="M8.5 21 H6.2 C5.3 21 4.6 20.3 4.6 19.4 V12.6 C4.6 11.7 5.3 11 6.2 11 H8.5 Z" fill="#2E7BE8"/><path d="M10 11 L13.4 3.6 C13.7 3 14.4 2.8 15 3 C15.9 3.4 16.4 4.4 16.2 5.4 L15.5 8.8 H19 C20.2 8.8 21.1 9.9 20.8 11.1 L19.4 18.4 C19.2 19.6 18.2 20.5 17 20.5 H10 Z" fill="#3D8DF5"/>`,
 love:`<path d="M12 20.5 C12 20.5 3 15.2 3 9.8 C3 6.9 5.2 5 7.6 5 C9.4 5 11.1 6 12 7.6 C12.9 6 14.6 5 16.4 5 C18.8 5 21 6.9 21 9.8 C21 15.2 12 20.5 12 20.5 Z" fill="#E8385A"/>`,
 laugh:`<circle cx="12" cy="12" r="9" fill="${FACE}"/><path d="M7 10.6 C7.9 9.3 9.5 9.3 10.4 10.6" stroke="${INK}" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M13.6 10.6 C14.5 9.3 16.1 9.3 17 10.6" stroke="${INK}" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M6.6 13.6 H17.4 C17.4 17 15 19 12 19 C9 19 6.6 17 6.6 13.6 Z" fill="${INK}"/>`,
 wow:`<circle cx="12" cy="12" r="9" fill="${FACE}"/><circle cx="8.7" cy="10" r="1.4" fill="${INK}"/><circle cx="15.3" cy="10" r="1.4" fill="${INK}"/><circle cx="12" cy="15.6" r="2.6" fill="${INK}"/>`,
 sad:`<circle cx="12" cy="12" r="9" fill="${FACE}"/><circle cx="8.7" cy="10.2" r="1.3" fill="${INK}"/><circle cx="15.3" cy="10.2" r="1.3" fill="${INK}"/><path d="M8.2 17 C9.3 15.2 14.7 15.2 15.8 17" stroke="${INK}" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M17 12.4 C17 12.4 18.6 14.3 18.6 15.4 C18.6 16.3 17.9 17 17 17 C16.1 17 15.4 16.3 15.4 15.4 C15.4 14.3 17 12.4 17 12.4 Z" fill="#4AA3F0"/>`,
 party:`<path d="M3.4 20.6 L9.2 8.8 L15.2 14.8 Z" fill="#F0932B"/><circle cx="16.4" cy="6.2" r="1.5" fill="#E8385A"/><circle cx="20" cy="9.6" r="1.2" fill="#3D8DF5"/><circle cx="19.2" cy="4" r="1.1" fill="#F5B301"/><circle cx="13.2" cy="3.6" r="1.1" fill="#3BC47D"/>`};
const L={like:"like",love:"love",laugh:"laugh",wow:"wow",sad:"sad",party:"party"};
function render(el){
 let big='<div class="row">';
 for(const k in D) big+=`<div class="cell">${S({s:34,body:D[k]})}<small>${L[k]}</small></div>`;
 big+='</div>';
 let small='<div class="row">';
 for(const k in D) small+=`<div class="cell">${S({s:16,body:D[k]})}</div>`;
 small+='</div>';
 const ctx=`<div><span class="bubble">Tu viens samedi ?</span><div class="pills">
   <span class="pill">${S({s:14,body:D.love})}2</span>
   <span class="pill">${S({s:14,body:D.laugh})}1</span>
   <span class="pill">${S({s:14,body:D.party})}3</span></div></div>`;
 el.innerHTML=big+small+ctx;
}
render(document.getElementById('a'));render(document.getElementById('b'));
</script>
