# ─────────────────────────────────────────────────────────────────────────────
# Avatars servis directement par nginx (sans passer par Node)
#
# À insérer dans le server block HTTPS de birthreminder.com,
# AVANT le `location /` qui proxy_pass vers Node.
#
#   sudo nano /etc/nginx/sites-available/birthreminder
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

location /uploads/avatars/ {
    alias /var/www/birthreminder/uploads/avatars/;

    # Le fichier porte un nom fixe (<userId>.webp) mais l'URL stockée en base
    # embarque un `?v=<timestamp>` régénéré à chaque upload. La clé de cache du
    # navigateur inclut la query string : un changement d'avatar produit donc
    # une nouvelle clé, ce qui rend `immutable` sûr.
    #
    # ⚠️ Corollaire : ne jamais construire une URL d'avatar à la main sans le
    # `?v=`. Toujours utiliser le champ `user.avatar` tel quel.
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # helmet() pose Cross-Origin-Resource-Policy: same-origin sur les réponses
    # Node. Ici c'est nginx qui répond : on autorise explicitement le partage
    # cross-origin (utile pour l'app mobile et un éventuel sous-domaine front).
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Rien d'exécutable ne doit sortir d'ici, quoi qu'il arrive.
    add_header X-Content-Type-Options "nosniff" always;

    # Pas de listing du dossier
    autoindex off;

    # 404 propre si le fichier n'existe pas (évite de tomber sur le catch-all
    # qui renverrait index.html avec un Content-Type HTML)
    try_files $uri =404;

    # Les avatars sont de petits fichiers statiques : inutile de logger
    access_log off;
}
