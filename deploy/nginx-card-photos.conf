# ─────────────────────────────────────────────────────────────────────────────
# Photos de carte (dates manuelles) servies directement par nginx (sans Node)
# — même principe que nginx-avatars.conf.
#
# À insérer dans le server block HTTPS de birthreminder.com,
# AVANT le `location /` qui proxy_pass vers Node.
#
#   sudo nano /etc/nginx/sites-available/birthreminder
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

location /uploads/card-photos/ {
    alias /var/www/birthreminder/uploads/card-photos/;

    # Le fichier porte un nom fixe (<dateId>.webp) mais l'URL stockée en base
    # embarque un `?v=<timestamp>` régénéré à chaque upload — voir
    # nginx-avatars.conf pour le détail du raisonnement (identique ici).
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    autoindex off;
    try_files $uri =404;
    access_log off;
}
