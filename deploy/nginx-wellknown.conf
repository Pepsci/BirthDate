# ─────────────────────────────────────────────────────────────────────────────
# Universal Links (iOS) + App Links (Android)
#
# Sert les fichiers de vérification qui autorisent l'app mobile à intercepter
# les liens https://birthreminder.com/... (reçus par email, etc.).
#
# À insérer dans le server block HTTPS de birthreminder.com, AVANT le
# `location /` qui proxy_pass vers Node (comme nginx-avatars.conf).
#
#   sudo nano /etc/nginx/sites-available/birthreminder
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ Prérequis :
#   1. Déposer les deux fichiers dans /var/www/birthreminder/.well-known/
#      (apple-app-site-association SANS extension, assetlinks.json)
#   2. Servi en HTTPS, sans redirection, avec Content-Type application/json
#      → c'est ce que garantit ce bloc.
# ─────────────────────────────────────────────────────────────────────────────

# iOS — fichier SANS extension, content-type forcé en JSON
location = /.well-known/apple-app-site-association {
    alias /var/www/birthreminder/.well-known/apple-app-site-association;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
    access_log off;
}

# Android — App Links
location = /.well-known/assetlinks.json {
    alias /var/www/birthreminder/.well-known/assetlinks.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
    access_log off;
}
